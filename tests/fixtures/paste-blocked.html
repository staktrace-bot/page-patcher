<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Net Banking Login</title>
    <style>
      .container { width: 1100px; margin: 0 auto; }
      .left { float: left; width: 700px; }
      .right { float: right; width: 380px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><img src="/logo.png" alt="Bank logo" /><span class="tagline">Secure Net Banking</span></div>
      <div class="left">
        <h2>Important notices</h2>
        <ul class="notices"><li>Never share your OTP.</li><li>Update your KYC by 31 Dec.</li></ul>
      </div>
      <div class="right">
        <form id="loginForm" name="loginForm" action="/login" method="post" autocomplete="off">
          <label for="txtUserId">User ID</label>
          <input type="text" id="txtUserId" name="userId" maxlength="20" onpaste="return false" oncopy="return false" />
          <label for="txtPassword">Password</label>
          <input type="password" id="txtPassword" name="password" autocomplete="off" onpaste="return false;" oncontextmenu="return false" ondrop="return false" />
          <label for="txtCaptcha">Enter captcha</label>
          <input type="text" id="txtCaptcha" name="captcha" value="SECRETVALUE" />
          <button type="submit" class="btn btn-login">Login</button>
        </form>
      </div>
    </div>
    <script>
      document.getElementById("txtPassword").addEventListener("paste", function (e) { e.preventDefault(); });
      document.addEventListener("keydown", function (e) { if (e.ctrlKey && e.key === "v") e.preventDefault(); });
    </script>
  </body>
</html>
